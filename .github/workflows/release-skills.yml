name: Release Skills

on:
  push:
    branches: [main]
    paths:
      - 'skills/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Discover skills and create zips
        id: zip
        run: |
          mkdir -p release-assets
          skills=""
          for dir in skills/*/; do
            if [ -f "${dir}SKILL.md" ]; then
              skill_name=$(basename "$dir")
              echo "Zipping skill: $skill_name"
              cd skills
              zip -r "../release-assets/${skill_name}.skill" "$skill_name" \
                -x "*/.DS_Store" "*/__pycache__/*" "*.pyc" "*/.DS_Store"
              cd ..
              skills="${skills}${skill_name}, "
            fi
          done
          echo "skills=${skills%, }" >> "$GITHUB_OUTPUT"

      - name: Get version from package.json
        id: version
        run: |
          next=$(node -p "require('./package.json').version")
          echo "tag=v${next}" >> "$GITHUB_OUTPUT"
          echo "Version: v${next}"

      # action-gh-release overwrites an existing tag's assets in place, so without this a
      # skills change that forgot the version bump silently rewrites the last published release.
      - name: Check whether this version is already released
        id: released
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.version.outputs.tag }}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::warning::$tag is already published and was left untouched. Bump the version in package.json to release these changes."
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create release
        if: steps.released.outputs.new == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          make_latest: true
          files: release-assets/*.skill
