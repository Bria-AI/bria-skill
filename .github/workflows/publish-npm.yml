name: Publish to npm

on:
  workflow_run:
    workflows: ["Release Skills"]
    types: [completed]

permissions:
  id-token: write  # Required for OIDC
  contents: read

jobs:
  publish:
    # Release Skills can fail and still fire workflow_run, which would publish an unreleased tree.
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - run: npm install --ignore-scripts
      - run: npm run build --if-present
      # Most runs carry a version npm already has; skipping keeps red meaning auth or network.
      - id: target
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if [ -n "$(npm view "$name@$version" version 2>/dev/null)" ]; then
            echo "$name@$version is already on npm - nothing to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.target.outputs.publish == 'true'
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
